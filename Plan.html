<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow phone column, scoreboard header, fixed bottom tab bar. */
:root {
  --bg: #f3f1ec;
  --surface: #ffffff;
  --line: #ddd8cd;
  --fg: #1b2230;
  --muted: #646a74;
  --accent: #d9581c;
  --accent-ink: #ffffff;
  --accent-soft: #fbe6da;
  --ok: #2f7d4f;
  --ok-soft: #dcefe3;
  --board: #1b2230;
  --board-fg: #f3f1ec;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1b212b; --line: #2c3440; --fg: #ecebe6; --muted: #9aa1ab;
    --accent: #f07a3c; --accent-ink: #1a0f08; --accent-soft: #3a2418; --ok: #5cc285; --ok-soft: #1b3326;
    --board: #0b0e13; --board-fg: #ecebe6; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1b212b; --line: #2c3440; --fg: #ecebe6; --muted: #9aa1ab;
  --accent: #f07a3c; --accent-ink: #1a0f08; --accent-soft: #3a2418; --ok: #5cc285; --ok-soft: #1b3326;
  --board: #0b0e13; --board-fg: #ecebe6; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--board); }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.board { background: var(--board); color: var(--board-fg); }
header.board .wrap { padding-block: 18px 16px; display: grid; gap: 12px; }
.brand { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 1.6rem; letter-spacing: .02em; text-transform: uppercase; margin: 0; }
.brand .phase { font-family: var(--display); font-weight: 600; font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { border: 1px solid color-mix(in srgb, var(--board-fg) 18%, transparent); border-radius: 8px; padding: 8px 10px; }
.stat b { display: block; font-family: var(--display); font-weight: 700; font-size: 1.7rem; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }

main { padding-block: 16px calc(84px + env(safe-area-inset-bottom, 0px)); }
section[data-view] { display: grid; gap: 14px; }

.daynav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.daynav h2 { font-family: var(--display); font-weight: 700; font-size: 1.9rem; margin: 0; line-height: 1; text-transform: uppercase; }
.daynav .date { color: var(--muted); font-size: .9rem; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 1.2rem; cursor: pointer; flex: none; }
.iconbtn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.todaylink { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 600; padding: 0; cursor: pointer; text-decoration: underline; }

.session { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
.session .kind { font-family: var(--display); font-size: .85rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.session .title { font-family: var(--display); font-size: 1.4rem; font-weight: 700; line-height: 1.1; }
.session .meta { color: var(--muted); font-size: .9rem; }
.progressbar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.progressbar i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .25s; }

.banner { background: var(--accent-soft); border-radius: 10px; padding: 10px 14px; font-size: .92rem; }
.toggle { display: flex; align-items: center; gap: 10px; font-size: .92rem; color: var(--muted); }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }

.block h3 { font-family: var(--display); font-weight: 700; font-size: .95rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 6px 0 8px; }
.list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.item { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 12px; cursor: pointer; }
.item input { width: 24px; height: 24px; margin: 0; accent-color: var(--ok); }
.item .name { font-weight: 600; min-width: 0; }
.item .note { display: block; font-weight: 400; color: var(--muted); font-size: .86rem; }
.item .sets { font-family: var(--display); font-weight: 700; font-size: 1.05rem; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.item.done { background: var(--ok-soft); border-color: transparent; }
.item.done .name { text-decoration: line-through; text-decoration-color: var(--muted); }

.week { display: grid; gap: 8px; }
.weekday { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: left; font: inherit; color: inherit; cursor: pointer; width: 100%; }
.weekday .dn { font-family: var(--display); font-weight: 800; font-size: 1.3rem; text-transform: uppercase; line-height: 1; }
.weekday .dn small { display: block; font-size: .75rem; font-weight: 600; color: var(--muted); }
.weekday .what { min-width: 0; }
.weekday .what b { display: block; }
.weekday .what span { color: var(--muted); font-size: .86rem; }
.weekday.today { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.pill { font-family: var(--display); font-weight: 700; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: var(--line); color: var(--muted); white-space: nowrap; }
.pill.ball { background: var(--accent-soft); color: var(--accent); }
.pill.done { background: var(--ok-soft); color: var(--ok); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.card h3 { font-family: var(--display); font-size: 1.15rem; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .03em; }
.card p, .card li { margin: 0 0 6px; max-width: 65ch; }
.card ul { padding-left: 1.1em; margin: 0; }
.field { display: grid; gap: 4px; font-size: .9rem; color: var(--muted); }
.field input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; width: 100%; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
th { font-family: var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
td input { width: 64px; font: inherit; font-variant-numeric: tabular-nums; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
.small { font-size: .85rem; color: var(--muted); }

nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); z-index: 5; }
nav.tabs .row { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
nav.tabs button { background: none; border: 0; padding: 12px 2px 10px; font-family: var(--display); font-weight: 700; font-size: .9rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); cursor: pointer; border-top: 3px solid transparent; }
nav.tabs button[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="board">
  <div class="wrap">
    <div class="brand"><h1>Plan</h1><span class="phase" id="phaseLabel">Phase 1</span></div>
    <div class="stats">
      <div class="stat"><b id="statWeek">1</b><span>Week of 12</span></div>
      <div class="stat"><b id="statStreak">0</b><span>Day streak</span></div>
      <div class="stat"><b id="statWeekDone">0/7</b><span>Days done</span></div>
    </div>
  </div>
</header>

<main class="wrap">
  <section data-view="today" id="viewToday"></section>
  <section data-view="week" id="viewWeek" hidden></section>
  <section data-view="knees" id="viewKnees" hidden></section>
  <section data-view="progress" id="viewProgress" hidden></section>
  <section data-view="rules" id="viewRules" hidden></section>
</main>

<nav class="tabs" aria-label="Sections">
  <div class="row">
    <button data-tab="today" aria-current="page">Today</button>
    <button data-tab="week">Week</button>
    <button data-tab="knees">Knees</button>
    <button data-tab="progress">Progress</button>
    <button data-tab="rules">Rules</button>
  </div>
</nav>

<script>
(function () {
  // ---------- storage ----------
  const KEY = "comeback-plan-v1";
  let store = {};
  try { store = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { store = {}; }
  store.checks = store.checks || {}; store.bad = store.bad || {}; store.meas = store.meas || {};
  store.start = store.start || "2026-11-02";
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }

  // ---------- dates ----------
  const DAY = 86400000;
  const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
  const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  function startMonday() { const s = parse(store.start); return addDays(s, -((s.getDay() + 6) % 7)); }
  function weekOf(d) { return Math.floor((d - startMonday()) / DAY / 7) + 1; }
  function phaseOf(w) { return w <= 4 ? 1 : w <= 8 ? 2 : 3; }
  const fmt = d => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });

  // ---------- plan data ----------
  const X = (n, s, t) => ({ n, s, t });
  const WARM = [X("Easy bike", "5 min"), X("Calf stretch", "30s each"), X("Hip flexor stretch", "30s each"), X("Hamstring stretch", "30s each"), X("Quad stretch", "30s each")];
  const KNEE = [
    X("Calf stretch against a wall", "30s each"), X("Half-kneeling hip flexor stretch", "30s each", "Pad under the knee"),
    X("Lying hamstring stretch", "30s each", "Towel or strap"), X("Standing quad stretch", "30s each", "Hold a wall"),
    X("Glute bridge", "2 × 12", "Squeeze at the top"), X("Clamshells", "2 × 12 each", "Band optional"),
    X("Straight-leg raise", "2 × 10 each", "Tighten the thigh first"), X("Terminal knee extension", "2 × 15 each", "Band behind the knee")
  ];
  const BALLWARM = [X("Light jog or shuffle", "2 min"), X("Leg swings, both directions", "10 each"), X("Bodyweight squats", "10"),
    X("Walking lunges, short steps", "6 each"), X("Lateral shuffles + backpedals", "2 lengths"), X("Easy layups and jump stops", "1–2 min")];
  const BAD = [X("Easy bike", "5 min"), X("Box squats", "2 × 10"), X("Incline push-ups", "2 × 10"), X("Glute bridges", "2 × 12"), X("Plank", "2 × 20s")];

  const S = {
    1: {
      A: [X("Box squat to a bench", "3 × 10", "Lower the box over time"), X("Glute bridge", "3 × 12", "Add weight by Week 3"),
          X("Step-ups, 6–8\" step", "2 × 8 each", "Slow on the way down"), X("Hamstring curl machine", "3 × 12", "Light"),
          X("Seated calf raise", "3 × 15"), X("Side plank on knees", "2 × 20s each")],
      B: [X("Incline push-ups", "3 × 8–12", "Hands on a bench"), X("Lat pulldown", "3 × 10"), X("Seated DB shoulder press", "3 × 10"),
          X("Seated cable row", "3 × 12"), X("Dead bug", "3 × 8 each", "Lower back on the floor"), X("Plank, knees if needed", "3 × 20s")],
      Bc: [X("Bike or incline walk", "20 min", "Can talk, can't sing")],
      Sat: [X("Low-impact cardio", "40 min", "Bike, incline walk, elliptical or pool")]
    },
    2: {
      A: [X("Goblet squat", "3 × 8–10", "To a box if needed"), X("Romanian deadlift, dumbbells", "3 × 10", "Hips back"),
          X("Step-ups, 10–12\" step", "3 × 8 each"), X("Spanish squat or wall sit", "3 × 30s", "Good for knee tendons"),
          X("Single-leg calf raise", "3 × 12 each"), X("Side plank", "3 × 25s each")],
      B: [X("Push-ups, low incline or floor", "3 × 8–12"), X("Dumbbell row", "3 × 10 each"), X("Lat pulldown", "3 × 10"),
          X("Dumbbell bench press", "3 × 10"), X("Pallof press", "3 × 10 each")],
      Bc: [X("Bike intervals", "20 min", "1 min hard / 2 min easy × 6")],
      C: [X("Trap-bar or kettlebell deadlift", "3 × 8"), X("Split squat, hold support", "2 × 8 each", "Short range at first"),
          X("Farmer carry", "3 × 40 yd", "Heavy-ish"), X("Push-ups", "2 × max", "Stop 2 short of failure")],
      Sat: [X("Low-impact cardio", "30–40 min", "Easy pace")]
    },
    3: {
      A: [X("Front squat or heavy goblet squat", "4 × 6–8"), X("Romanian deadlift", "3 × 10"), X("Step-ups, 10–12\" step", "3 × 8 each"),
          X("Spanish squat or wall sit", "3 × 30s"), X("Lateral band walks", "3 × 12 each way"), X("Low pogo hops", "3 × 15", "Small and quiet"),
          X("Single-leg calf raise", "3 × 12 each")],
      B: [X("Push-ups", "3 × 10–15"), X("Dumbbell row", "3 × 10 each"), X("Lat pulldown", "3 × 10"), X("Dumbbell bench press", "3 × 10"),
          X("Pallof press", "3 × 10 each"), X("Med-ball chest pass", "3 × 8", "Explosive")],
      Bc: [X("Bike intervals", "~20 min", "30s hard / 60s easy × 10")],
      C: [X("Trap-bar or kettlebell deadlift", "3 × 6–8"), X("Split squat", "3 × 8 each"), X("Farmer carry", "3 × 40 yd"),
          X("Push-ups", "2 × max")],
      Slides: [X("Defensive slides + backpedal drills", "10 min", "Moderate speed")],
      Sat: [X("Low-impact cardio", "25 min", "Easy pace")]
    }
  };

  // Returns {kind, title, meta, gym, ball, blocks:[{key,h,items}]}
  function planFor(date) {
    const dow = date.getDay(), w = Math.max(1, weekOf(date)), p = phaseOf(w), P = S[p];
    const knee = { key: "knee", h: "Daily knee routine · 10 min", items: KNEE };
    const bad = !!store.bad[iso(date)];
    if (dow === 1) return { kind: "Strength A", title: "Legs and knees", meta: "After work, ~5:00 pm · 45–50 min", gym: true,
      blocks: bad ? [{ key: "bad", h: "15-minute version", items: BAD }, knee] :
        [{ key: "warm", h: "Warm-up", items: WARM }, { key: "A", h: "Strength A · rest 60–90s", items: P.A },
         { key: "fin", h: "Finish", items: [X("Easy bike", "10 min", "Conversational pace")] }, knee] };
    if (dow === 3) return { kind: "Strength B", title: "Upper body and core", meta: "After work, ~5:00 pm · 50–60 min", gym: true,
      blocks: bad ? [{ key: "bad", h: "15-minute version", items: BAD }, knee] :
        [{ key: "warm", h: "Warm-up", items: WARM }, { key: "B", h: "Strength B", items: P.B }, { key: "Bc", h: "Conditioning", items: P.Bc }, knee] };
    if (dow === 2 || dow === 5) {
      const after = dow === 2
        ? [X("Post-game stretches", "5 min"), X("Breakfast with protein", "Before work")]
        : [X("Post-game stretches", "5 min"), X("Breakfast with protein", "Before work"), X("Evening foam roll", "5 min", "Quads, outer thigh, calves, glutes")];
      const k = dow === 5 ? { key: "knee", h: "Evening long stretch · hold 60s each", items: KNEE } : { key: "knee", h: "Knee routine · before bed, after class", items: KNEE };
      return { kind: "Game day", title: "Basketball, 6:00 am", meta: dow === 2 ? "Class tonight 6:00–8:30 pm" : "Long stretch tonight", ball: true,
        blocks: [{ key: "bw", h: "8-minute warm-up before you play", items: BALLWARM },
          { key: "play", h: "Play", items: [X("Basketball", w <= 4 ? "70–80%" : "Full", w <= 4 ? "Sit a game out if knees talk" : "Land on two feet when you can")] },
          { key: "after", h: "After", items: after }, k] };
    }
    if (dow === 4) return { kind: "Light day", title: "Walk + knee routine", meta: "Class 4:15–6:45 pm · lunch or before work",
      blocks: [{ key: "walk", h: "Move", items: [X("Brisk walk", "20–30 min", "Lunch break works")] }, knee] };
    if (dow === 6) {
      if (p === 1 || bad) return { kind: "Saturday", title: bad ? "15-minute version" : "Long easy cardio", meta: "Morning · 45 min", gym: true,
        blocks: bad ? [{ key: "bad", h: "15-minute version", items: BAD }, knee] : [{ key: "warm", h: "Warm-up", items: WARM.slice(0,1) }, { key: "sat", h: "Cardio", items: P.Sat }, knee] };
      const blocks = [{ key: "warm", h: "Warm-up", items: WARM }, { key: "C", h: "Strength C · full body", items: w >= 11 ? P.C.concat([X("Box jumps, low box", "3 × 5", "Step down; skip if knees ache")]) : P.C }];
      if (p === 3) blocks.push({ key: "sl", h: "Court work", items: P.Slides });
      blocks.push({ key: "sat", h: "Cardio", items: P.Sat }, knee);
      return { kind: "Strength C", title: "Full body + cardio", meta: "Morning · 60–75 min", gym: true, blocks };
    }
    return { kind: "Rest day", title: "Recover and plan", meta: "Easy walk if you want",
      blocks: [{ key: "sun", h: "Set up the week", items: [X("Cook protein + carbs", "Batch", "For Mon–Wed"), X("Pack Tuesday + Thursday food", "Long days"), X("Put Mon, Wed, Sat sessions in your calendar", "")] }, knee] };
  }

  const ck = (date, key, i) => iso(date) + "|" + key + "|" + i;
  function counts(date) {
    const pl = planFor(date); let t = 0, d = 0;
    pl.blocks.forEach(b => b.items.forEach((_, i) => { t++; if (store.checks[ck(date, b.key, i)]) d++; }));
    return { t, d, done: t > 0 && d === t };
  }
  function streak() {
    let d = today(), n = 0;
    if (!counts(d).done) d = addDays(d, -1);
    const s = startMonday();
    while (d >= s && counts(d).done && n < 400) { n++; d = addDays(d, -1); }
    return n;
  }

  // ---------- render ----------
  let view = today();
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function header() {
    const w = weekOf(today());
    const shown = Math.min(12, Math.max(1, w));
    document.getElementById("statWeek").textContent = w < 1 ? "–" : w > 12 ? "12+" : shown;
    document.getElementById("phaseLabel").textContent = w < 1 ? "Starts " + fmt(startMonday()) : "Phase " + phaseOf(w);
    document.getElementById("statStreak").textContent = streak();
    const m = addDays(today(), -((today().getDay() + 6) % 7)); let c = 0;
    for (let i = 0; i < 7; i++) if (counts(addDays(m, i)).done) c++;
    document.getElementById("statWeekDone").textContent = c + "/7";
  }

  function renderToday() {
    const el = document.getElementById("viewToday");
    const pl = planFor(view), c = counts(view), w = weekOf(view), isToday = iso(view) === iso(today());
    let h = `<div class="daynav"><button class="iconbtn" id="prevDay" aria-label="Previous day">‹</button>
      <div style="text-align:center;min-width:0"><h2>${isToday ? "Today" : DOW[view.getDay()]}</h2>
      <div class="date">${DOW[view.getDay()]}, ${fmt(view)}${w >= 1 ? " · Week " + w : ""}${isToday ? "" : ' · <button class="todaylink" id="goToday">Back to today</button>'}</div></div>
      <button class="iconbtn" id="nextDay" aria-label="Next day">›</button></div>`;
    if (w < 1) h += `<div class="banner">The plan starts Monday, ${fmt(startMonday())}. This is a preview of Phase 1. Change the start date under Progress.</div>`;
    h += `<div class="session"><span class="kind">${pl.kind}</span><span class="title">${pl.title}</span><span class="meta">${pl.meta}</span>
      <div class="progressbar" aria-label="${c.d} of ${c.t} done"><i style="width:${c.t ? (c.d / c.t * 100) : 0}%"></i></div>
      <span class="small">${c.d} of ${c.t} done${c.done ? " · day complete" : ""}</span></div>`;
    if (pl.gym) h += `<label class="toggle"><input type="checkbox" id="badDay" ${store.bad[iso(view)] ? "checked" : ""}> Rough day? Switch to the 15-minute version. It still counts.</label>`;
    pl.blocks.forEach(b => {
      h += `<div class="block"><h3>${esc(b.h)}</h3><ul class="list">`;
      b.items.forEach((it, i) => {
        const k = ck(view, b.key, i), on = !!store.checks[k], id = "c-" + b.key + "-" + i;
        h += `<li><label class="item${on ? " done" : ""}" for="${id}"><input type="checkbox" id="${id}" data-k="${k}" ${on ? "checked" : ""}>
          <span class="name">${esc(it.n)}${it.t ? `<span class="note">${esc(it.t)}</span>` : ""}</span><span class="sets">${esc(it.s || "")}</span></label></li>`;
      });
      h += `</ul></div>`;
    });
    if (pl.ball) h += `<div class="card"><p class="small">Knee puffy or sore after? Ice 15 min and make the next gym day upper-body only.</p></div>`;
    el.innerHTML = h;
    el.querySelector("#prevDay").onclick = () => { view = addDays(view, -1); renderToday(); };
    el.querySelector("#nextDay").onclick = () => { view = addDays(view, 1); renderToday(); };
    const gt = el.querySelector("#goToday"); if (gt) gt.onclick = () => { view = today(); renderToday(); };
    const bd = el.querySelector("#badDay"); if (bd) bd.onchange = () => { store.bad[iso(view)] = bd.checked; save(); renderToday(); header(); };
    el.querySelectorAll("input[data-k]").forEach(inp => inp.onchange = () => {
      if (inp.checked) store.checks[inp.dataset.k] = 1; else delete store.checks[inp.dataset.k];
      save(); renderToday(); header();
    });
  }

  function renderWeek() {
    const el = document.getElementById("viewWeek");
    const base = weekOf(today()) < 1 ? startMonday() : addDays(today(), -((today().getDay() + 6) % 7));
    const w = Math.max(1, weekOf(base));
    let h = `<div class="daynav"><h2>Week ${w}</h2><span class="pill">Phase ${phaseOf(w)}</span></div><div class="week">`;
    for (let i = 0; i < 7; i++) {
      const d = addDays(base, i), pl = planFor(d), c = counts(d), isT = iso(d) === iso(today());
      const pill = c.done ? `<span class="pill done">Done</span>` : pl.ball ? `<span class="pill ball">Ball</span>` : c.d ? `<span class="pill">${c.d}/${c.t}</span>` : "";
      h += `<button class="weekday${isT ? " today" : ""}" data-d="${iso(d)}"><span class="dn">${DOW[d.getDay()].slice(0,3)}<small>${fmt(d)}</small></span>
        <span class="what"><b>${pl.kind}</b><span>${pl.title}</span></span>${pill}</button>`;
    }
    h += `</div><p class="small">Tap a day to open it. Hard leg day sits far from both ball days; Thursday stays light for class.</p>`;
    el.innerHTML = h;
    el.querySelectorAll(".weekday").forEach(b => b.onclick = () => { view = parse(b.dataset.d); show("today"); });
  }

  function renderKnees() {
    const el = document.getElementById("viewKnees");
    let h = `<div class="card"><h3>Daily knee routine</h3><p>Ten minutes, every day, including ball days. Tight hips, quads and calves load the knee joint, so this habit matters most.</p></div><ul class="list">`;
    KNEE.forEach(it => h += `<li class="item" style="grid-template-columns:1fr auto;cursor:default"><span class="name">${esc(it.n)}${it.t ? `<span class="note">${esc(it.t)}</span>` : ""}</span><span class="sets">${esc(it.s)}</span></li>`);
    h += `</ul><div class="card"><h3>Pain rule</h3><p>Discomfort up to 3 out of 10 that settles by the next morning is OK. Higher than that, or worse the next day, means scale back.</p>
      <p>Stop an exercise for sharp pain, swelling, locking or the knee giving way. Get the knees checked by a doctor or physical therapist before adding load.</p></div>
      <div class="card"><h3>Game-day warm-up</h3><ul>${BALLWARM.map(i => `<li>${esc(i.n)} — ${esc(i.s)}</li>`).join("")}</ul></div>`;
    el.innerHTML = h;
  }

  function renderProgress() {
    const el = document.getElementById("viewProgress");
    const rows = [["w", "Weight (lb)"], ["waist", "Waist (in)"], ["pu", "Push-ups in a row"], ["ws", "Wall sit (sec)"], ["kp", "Knee pain on ball days (0–10)"]];
    const cols = [0, 4, 8, 12];
    if (store.meas["w-0"] == null) store.meas["w-0"] = "250";
    let h = `<div class="card"><h3>Measurements</h3><p class="small">Take them at the start, then every 4 weeks. Saved on this phone only.</p>
      <div class="tablewrap"><table><thead><tr><th></th>${cols.map(c => `<th>Wk ${c}</th>`).join("")}</tr></thead><tbody>`;
    rows.forEach(([k, label]) => {
      h += `<tr><td>${label}</td>${cols.map(c => `<td><input inputmode="decimal" id="m-${k}-${c}" data-m="${k}-${c}" value="${esc(store.meas[k + "-" + c] || "")}" aria-label="${label}, week ${c}"></td>`).join("")}</tr>`;
    });
    h += `</tbody></table></div></div>
      <div class="card"><h3>Start date</h3><label class="field" for="startDate">Week 1 begins the Monday of this date
      <input type="date" id="startDate" value="${store.start}"></label></div>
      <div class="card"><h3>Never miss twice</h3><p>Missing one day is life. Missing two in a row is how the month-long breaks start. If you do miss a week, go back one phase at lighter weights and start the next day.</p></div>`;
    el.innerHTML = h;
    el.querySelectorAll("input[data-m]").forEach(i => i.oninput = () => { store.meas[i.dataset.m] = i.value; save(); });
    el.querySelector("#startDate").onchange = e => { if (e.target.value) { store.start = e.target.value; save(); view = today(); header(); } };
  }

  function renderRules() {
    document.getElementById("viewRules").innerHTML = `
      <div class="card"><h3>The 12-week goal</h3><p>Train 4–5 days every week without a multi-week break, protect your knees, and lose 1–2 lb a week. Phase 1 should feel almost too easy.</p></div>
      <div class="card"><h3>Habits that stop the start-stop cycle</h3><ul>
        <li>Pack your gym bag the night before and go straight from work.</li>
        <li>Put Monday 5:00, Wednesday 5:00 and Saturday morning in your calendar like meetings.</li>
        <li>On a bad day, do the 15-minute version instead of skipping.</li>
        <li>Low impact first: build your engine on the bike, incline walk or pool before adding running.</li></ul></div>
      <div class="card"><h3>Phases</h3><ul>
        <li><b>Weeks 1–4:</b> build the habit. Light weights, two gym days plus Saturday cardio.</li>
        <li><b>Weeks 5–8:</b> build strength. Add weight and a Saturday full-body day once knees feel stable for two weeks.</li>
        <li><b>Weeks 9–12:</b> get game-ready. Heavier lifts, pogo hops, slides, and box jumps from Week 11 if knees allow.</li></ul></div>
      <div class="card"><h3>Food</h3><ul>
        <li>Protein at every meal, roughly 150–180 g a day.</li>
        <li>Half the plate vegetables or fruit at lunch and dinner.</li>
        <li>Cut soda, sweet coffee drinks, juice and beer first.</li>
        <li>Pack dinner on Tuesday and Thursday, your long class days.</li>
        <li>Sunday: batch-cook protein and a carb for the first half of the week.</li></ul></div>
      <div class="card"><h3>Sleep</h3><p>Aim for 7–8 hours. With 6:00 am games, that means lights out around 10:30 pm on Monday and Thursday.</p></div>`;
  }

  const views = { today: renderToday, week: renderWeek, knees: renderKnees, progress: renderProgress, rules: renderRules };
  function show(name) {
    document.querySelectorAll("section[data-view]").forEach(s => s.hidden = s.dataset.view !== name);
    document.querySelectorAll("nav.tabs button").forEach(b => { if (b.dataset.tab === name) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    views[name](); window.scrollTo(0, 0);
  }
  document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => { if (b.dataset.tab === "today") view = today(); show(b.dataset.tab); });
  header(); show("today");
})();
</script>

</body></html>
